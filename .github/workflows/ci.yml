name: ci

on:
  push:
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: max/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max/bot/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: max/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max/webapp/package-lock.json
      - run: npm ci
      - run: npm run build
